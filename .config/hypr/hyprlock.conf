# ┌─────────────────────────────────────────────────────────┐
# │  hyprlock · monochrom — Wallpaper + Uhr + Passwortfeld     │
# │  Weiterhin "bulletproof": Bild = vorhandenes Repo-Wall-    │
# │  paper (existiert garantiert), Uhr über eingebautes $TIME  │
# │  (KEINE Shell / kein cmd[] -> kann nicht hängen/abstürzen).│
# └─────────────────────────────────────────────────────────┘

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Hintergrund: dunkles Repo-Wallpaper mit dezentem Blur.
# 'color' bleibt als Fallback, falls das Bild mal fehlen sollte.
# Blur nicht gewünscht? -> blur_passes = 0
background {
    monitor =
    path = /home/loki/Pictures/wallpapers/wall.png
    color = rgba(0a0a0aff)
    blur_passes = 2
    blur_size = 4
}

# Uhrzeit — eingebaute Variable $TIME (aktualisiert sich selbst, ohne Shell).
label {
    monitor =
    text = $TIME
    color = rgba(e6e6e6ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Passwort-Eingabefeld, monochrom
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_center = true

    outer_color = rgba(c8c8c855)
    inner_color = rgba(0a0a0acc)
    font_color  = rgba(e6e6e6ff)

    fade_on_empty = false
    placeholder_text = Passwort
    hide_input = false

    check_color = rgba(c8c8c8ff)
    fail_color  = rgba(777777ff)

    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}
