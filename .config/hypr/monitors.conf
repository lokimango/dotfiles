# Diese Datei legt Monitore/Auflösung/Skalierung fest.
# Auf einem anderen Gerät ggf. anpassen:  hyprctl monitors  zeigt Namen/Modi.
#
# Format: monitor = NAME, AUFLÖSUNG@HZ, POSITION, SKALIERUNG
# Beispiele:
#   monitor = eDP-1,  1920x1080@60,  0x0,    1
#   monitor = DP-1,   2560x1440@144, 1920x0, 1
#
# Generisch (nutzt die bevorzugte Auflösung jedes angeschlossenen Displays):
monitor = , preferred, auto, 1
