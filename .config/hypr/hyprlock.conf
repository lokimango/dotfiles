# ┌─────────────────────────────────────────────────────────┐
# │  hyprlock · minimal, monochrom, bulletproof               │
# │  Nur fester Hintergrund + Passwortfeld — nichts, das      │
# │  beim Laden fehlschlagen oder Shells starten kann.        │
# └─────────────────────────────────────────────────────────┘

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Fester, fast schwarzer Hintergrund (kein Bild -> kann nicht fehlschlagen)
background {
    monitor =
    color = rgba(0a0a0aff)
}

# Passwort-Eingabefeld, monochrom
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_center = true

    outer_color = rgba(c8c8c855)
    inner_color = rgba(0a0a0acc)
    font_color  = rgba(e6e6e6ff)

    fade_on_empty = false
    placeholder_text = Passwort
    hide_input = false

    check_color = rgba(c8c8c8ff)
    fail_color  = rgba(777777ff)

    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}
