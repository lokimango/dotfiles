# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Fenster / Transparenz ─────────────────────────────
background_opacity        0.80
dynamic_background_opacity yes
confirm_os_window_close   0
window_padding_width      8
hide_window_decorations   yes
placement_strategy        center

# ── Cursor ────────────────────────────────────────────
cursor_shape       beam
cursor_blink_interval 0

# ── Scrollback ────────────────────────────────────────
scrollback_lines   10000

# ── Bell aus ──────────────────────────────────────────
enable_audio_bell  no
visual_bell_duration 0

# ── Tabs (minimal) ────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted

# ╭──────────────────────────────────────────────────────╮
# │  Monochrome / greyscale color scheme                   │
# ╰──────────────────────────────────────────────────────╯
foreground   #c8c8c8
background   #0a0a0a
cursor       #c8c8c8
cursor_text_color #0a0a0a

selection_foreground #0a0a0a
selection_background #c8c8c8

url_color    #888888

# Rand-/Titelfarben
active_border_color   #666666
inactive_border_color #1e1e1e
active_tab_foreground   #0a0a0a
active_tab_background   #999999
inactive_tab_foreground #777777
inactive_tab_background #141414

