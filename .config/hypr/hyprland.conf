# ┌─────────────────────────────────────────────────────────┐
# │  Minimal monochrome Hyprland config                       │
# │  Look: dark, greyscale, terminal/hacker aesthetic         │
# └─────────────────────────────────────────────────────────┘

################
### MONITORS ###
################
# ⚠ Hardware-abhängig — ausgelagert nach monitors.conf
source = ~/.config/hypr/monitors.conf


###################
### AUTOSTART   ###
###################
# Wallpaper: swaybg (hyprpaper 0.8.4 liest seine Config in dieser Version nicht)
exec-once = swaybg -i $HOME/Pictures/wallpapers/wall.png -m fill
exec-once = waybar
exec-once = swaync

# Clipboard-Historie: wl-paste beobachtet Text + Bilder, cliphist speichert sie
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### UMGEBUNGSVARIABLEN    ###
#############################
# ⚠ Teils hardware-abhängig — ausgelagert nach env.conf
source = ~/.config/hypr/env.conf


#############
### INPUT ###
#############
input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# Touchpad-Geste: 3 Finger horizontal wischen = Workspace wechseln
# (die alte "gestures { workspace_swipe }"-Sektion gibt es in dieser Version nicht mehr)
gesture = 3, horizontal, workspace


####################
### VARIABLEN    ###
####################
$terminal = kitty
$menu     = fuzzel
$browser  = xdg-open https://


#####################
### LOOK & FEEL   ###
#####################
general {
    gaps_in  = 3
    gaps_out = 6
    border_size = 1

    # Monochrom: aktiver Rand hellgrau, inaktiv fast unsichtbar
    col.active_border   = rgba(666666ff)
    col.inactive_border = rgba(1e1e1eff)

    resize_on_border = true
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6

    # Fenster leicht durchscheinend lassen (Terminals regeln Opacity selbst)
    active_opacity   = 1.0
    inactive_opacity = 1.0

    # Subtiler Blur, damit das dunkle Wallpaper dezent durchscheint
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.0
        vibrancy_darkness = 0.0
    }

    # Dezenter, dunkler Schatten – kein bunter Glow
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(000000aa)
    }
}

animations {
    enabled = true
    bezier = snappy, 0.25, 1, 0.5, 1
    animation = windows,     1, 3, snappy, slide
    animation = windowsOut,  1, 3, snappy, slide
    animation = fade,        1, 3, snappy
    animation = workspaces,  1, 3, snappy, slide
    animation = border,      1, 4, snappy
}

dwindle {
    # pseudotile-Option entfällt in dieser Version; Pseudotiling geht weiter über $mod+P (pseudo)
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # misc:vfr entfällt in dieser Version (VFR wird jetzt intern/über vrr geregelt)
}


#############
### RULES ###
#############
# Blur hinter Waybar und Launcher (neue Layerrule-Syntax: match:namespace + field = value)
layerrule = match:namespace = ^(waybar)$, blur = true
layerrule = match:namespace = ^(launcher|fuzzel)$, blur = true
layerrule = match:namespace = ^(wlogout)$, blur = true

# Gängige Dialoge floaten lassen (windowrulev2 heißt jetzt einfach windowrule)
windowrule = float = true, match:class = ^(pavucontrol)$
windowrule = float = true, match:class = ^(blueman-manager)$
windowrule = float = true, match:title = ^(Open File)$


###################
### KEYBINDINGS ###
###################
$mod = SUPER

# Programme
bind = $mod, RETURN, exec, $terminal
bind = $mod, B,      exec, firefox
bind = $mod, D,      exec, $menu

# Power-Menü (wlogout): Sperren / Abmelden / Ruhezustand / Neustart / Herunterfahren
bind = $mod, ESCAPE, exec, pkill wlogout || wlogout -b 5 -p layer-shell
bind = $mod, Q,      killactive,
bind = $mod, F,      fullscreen, 0
bind = $mod SHIFT, F, togglefloating,
bind = $mod, P,      pseudo,

# Clipboard-Historie über den Launcher (fuzzel)
bind = $mod, V,      exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod, J,      layoutmsg, togglesplit
bind = $mod SHIFT, Q, exit,

# Fokus verschieben (Pfeiltasten + vim hjkl)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
# (J ist togglesplit; Fokus nach unten via Pfeil)

# Fenster verschieben
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Fenster auf Workspace verschieben
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll durch Workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Fenster mit Maus bewegen/resizen
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots (speichern nach ~/Pictures/Screenshots + Zwischenablage + Notification)
bind = , Print,       exec, $HOME/.config/hypr/scripts/screenshot.sh region
bind = SHIFT, Print,  exec, $HOME/.config/hypr/scripts/screenshot.sh full
bind = $mod, Print,   exec, $HOME/.config/hypr/scripts/screenshot.sh window

# Lautstärke / Helligkeit (Media-Keys)
bindel = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
